<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETRMS - Dashboard</title>
    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
    <div class="app-container">
        <!-- Render Sidebar ở đây -->
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <!-- Render Header ở đây -->
            <div id="header-container"></div>

            <!-- Nội dung thay đổi từng trang -->
            <main class="main-content">
                <h1 class="page-title">Dashboard Tổng quan</h1>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 24px;">
                    <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <h3 style="color: var(--text-muted); font-size: 14px;">Tổng Dự án</h3>
                        <p style="font-size: 28px; font-weight: 700; margin-top: 8px;">12</p>
                    </div>
                    <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <h3 style="color: var(--text-muted); font-size: 14px;">Task đang chạy</h3>
                        <p style="font-size: 28px; font-weight: 700; margin-top: 8px;">48</p>
                    </div>
                    <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <h3 style="color: var(--text-muted); font-size: 14px;">Nhân sự Quá tải</h3>
                        <p style="font-size: 28px; font-weight: 700; margin-top: 8px; color: var(--danger-color);">3</p>
                    </div>
                </div>

                <div class="table-card">
                    <div class="table-toolbar">
                        <h3>Công việc của tôi</h3>
                        <button class="btn btn-primary">+ Tạo Task</button>
                    </div>
                    <div style="padding: 20px; text-align: center; color: var(--text-muted);">
                        📁 Chưa có dữ liệu Task nào
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Base JS -->
    <script src="/js/common.js"></script>
</body>
</html>
