<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETRMS - Dashboard Tổng quan</title>
    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/layout.css">
    <!-- Dashboard Specific CSS -->
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div class="app-container">
        <!-- Render Sidebar ở đây -->
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <!-- Render Header ở đây -->
            <div id="header-container"></div>

            <!-- Nội dung thay đổi từng trang -->
            <main class="main-content">
                <h1 class="page-title">Dashboard Tổng quan</h1>
                
                <div class="dashboard-grid">
                    <!-- KPI Cards Row -->
                    <div class="kpi-cards">
                        <div class="kpi-card">
                            <div class="kpi-title">Tổng Dự án</div>
                            <div class="kpi-value" id="kpi-total-projects">0</div>
                            <div class="kpi-subtext">Đang triển khai</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-title">Task đang chạy</div>
                            <div class="kpi-value" id="kpi-active-tasks">0</div>
                            <div class="kpi-subtext">Cần xử lý</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-title">Tổng Nhân sự</div>
                            <div class="kpi-value" id="kpi-total-employees">0</div>
                            <div class="kpi-subtext">Đang làm việc</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-title">Tỷ lệ đúng hạn</div>
                            <div class="kpi-value" style="color: var(--success-color);" id="kpi-ontime-rate">0%</div>
                            <div class="kpi-subtext">Trung bình công ty</div>
                        </div>
                    </div>

                    <!-- Row 2: WSI and Inbox -->
                    <div class="dashboard-row-2">
                        <!-- WSI Alert List -->
                        <div class="table-card">
                            <div class="table-toolbar">
                                <h3>Cảnh báo Sức tải (WSI)</h3>
                            </div>
                            <div style="padding: 20px;">
                                <div class="wsi-list" id="wsi-list-container">
                                    <!-- WSI items rendered by JS -->
                                </div>
                            </div>
                        </div>

                        <!-- Pending Approvals Inbox -->
                        <div class="table-card">
                            <div class="table-toolbar">
                                <h3>Hòm thư Yêu cầu & Cảnh báo</h3>
                            </div>
                            <ul class="inbox-list" id="inbox-container">
                                <!-- Inbox items rendered by JS -->
                            </ul>
                        </div>
                    </div>

                    <!-- Row 3: My Tasks Table -->
                    <div class="table-card" style="grid-column: span 12;">
                        <div class="table-toolbar">
                            <h3>Công việc của tôi</h3>
                            <!-- LƯU Ý: KHÔNG CÓ NÚT TẠO MỚI Ở ĐÂY -->
                        </div>
                        <div class="table-responsive">
                            <table class="dashboard-table">
                                <thead>
                                    <tr>
                                        <th>Tên Task</th>
                                        <th>Dự án</th>
                                        <th>Trạng thái</th>
                                        <th>Độ ưu tiên</th>
                                        <th>Ngày hết hạn</th>
                                    </tr>
                                </thead>
                                <tbody id="my-tasks-tbody">
                                    <!-- Task items rendered by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Base JS -->
    <script src="/js/common.js"></script>
    <!-- Dashboard JS -->
    <script src="/js/dashboard.js"></script>
</body>
</html>
