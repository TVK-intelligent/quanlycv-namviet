<header class="app-header">
    <div class="header-left">
        <button id="menu-toggle" class="btn-icon menu-toggle-btn" title="Toggle Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <div class="breadcrumb">
            <span class="breadcrumb-item" ></span>
    
            <span class="breadcrumb-item active">🏠 Dashboard </span>
        </div>
    </div>
    
    <div class="header-right">
        <div class="search-box">
            <div class="search-input-wrapper">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="form-control search-input" placeholder="Tìm kiếm nhanh... (Ctrl+K)">
            </div>
        </div>
        
        <div class="header-actions">
            <button class="btn-icon notification-btn" title="Thông báo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="notification-badge">3</span>
            </button>
        </div>

        <div class="user-profile-dropdown">
            <div class="user-avatar-trigger">
                <div class="avatar-circle">KV</div>
                <div class="user-info">
                    <span class="user-name">Khai Trần Văn</span>
                    <span class="user-role">Administrator</span>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dropdown-icon">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </div>
    </div>
</header>
