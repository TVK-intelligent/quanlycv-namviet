<header class="app-header">
    <div class="header-left">
        <button id="menu-toggle" class="btn-icon menu-toggle-btn" title="Toggle Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <!-- Tìm kiếm nhanh -->
        <div class="search-box" style="margin-left: 12px;">
            <div class="search-input-wrapper" style="position: relative; width: 220px;">
                <i class="fa-solid fa-magnifying-glass search-icon" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px;"></i>
                <input type="text" class="form-control search-input" placeholder="Tìm nhanh... (Ctrl+K)" style="padding-left: 32px; height: 32px; font-size: 13px; border-radius: var(--border-radius-pill); background-color: var(--bg-main); border: 1px solid transparent; width: 100%; outline: none; transition: all var(--transition-fast);">
            </div>
        </div>
    </div>
    
    <div class="header-right">

        <!-- Bộ chuyển đổi vai trò giả lập (Global Role Switcher) -->
        <div class="global-role-switcher" style="display: flex; align-items: center; gap: 8px; border-left: 1px solid var(--border-color); padding-left: 16px;">
            <span style="font-size: 12px; font-weight: 600; color: var(--text-muted);"><i class="fa-solid fa-user-shield"></i> Chế độ xem:</span>
            <select class="card-header-select" id="role-selector" style="height: 32px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: var(--border-radius-md); border: 1px solid var(--border-color); background-color: white; color: var(--text-main); outline: none; cursor: pointer;">
                <option value="all">Tất cả (Đầy đủ)</option>
                <option value="employee">Nhân viên (Dev/Tester)</option>
                <option value="pm">Quản lý dự án (PM)</option>
                <option value="head">Trưởng phòng</option>
            </select>
        </div>
        
        <!-- Nhóm các nút Tiện ích nhanh -->
        <div class="header-actions" style="display: flex; align-items: center; gap: 8px; border-left: 1px solid var(--border-color); padding-left: 16px;">
            <!-- Trợ giúp & Tài liệu -->
            <button id="btn-help" class="btn-icon" title="Tài liệu & Trợ giúp" style="color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background var(--transition-fast);">
                <i class="fa-solid fa-circle-question" style="font-size: 17px;"></i>
            </button>
            
            <!-- Cài đặt hệ thống -->
            <button id="btn-setting" class="btn-icon" title="Cài đặt hệ thống" style="color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background var(--transition-fast);">
                <i class="fa-solid fa-gear" style="font-size: 17px;"></i>
            </button>
            
            <!-- Hộp thư Thông báo -->
            <div style="position: relative; display: inline-block;">
                <button id="btn-notifications" class="btn-icon" title="Thông báo mới" style="color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 50%; position: relative; transition: background var(--transition-fast);">
                    <i class="fa-solid fa-bell" style="font-size: 17px;"></i>
                    <span class="notification-badge" id="noti-badge-count" style="position: absolute; top: 0; right: 0; background-color: var(--danger-color); color: white; font-size: 10px; font-weight: 700; height: 15px; min-width: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; padding: 0 2px;">3</span>
                </button>
                <!-- Hộp chứa Dropdown danh sách thông báo -->
                <div class="user-dropdown-menu" id="header-notifications-menu" style="width: 320px; padding: 0;">
                    <div style="padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-main); border-top-left-radius: var(--border-radius-lg); border-top-right-radius: var(--border-radius-lg);">
                        <span style="font-weight: 600; font-size: 13px; color: var(--text-main);">Thông báo</span>
                        <a href="#" id="btn-clear-notifications" style="font-size: 11px; color: var(--primary-color); text-decoration: none; font-weight: 500;">Đánh dấu đã đọc</a>
                    </div>
                    <div id="notifications-list-container" style="max-height: 280px; overflow-y: auto; padding: 4px 0;">
                        <!-- JS sẽ render các thông báo ở đây -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Thông tin Tài khoản Đăng nhập & Dropdown Menu -->
        <div class="user-profile-dropdown" id="user-profile-dropdown" style="border-left: 1px solid var(--border-color); padding-left: 16px; position: relative;">
            <div class="user-avatar-trigger" id="user-avatar-trigger" style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: var(--border-radius-md); transition: background var(--transition-fast);">
                <div class="avatar-circle" id="header-user-avatar" style="width: 32px; height: 32px; border-radius: 50%; background-color: var(--primary-color); color: white; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;">KT</div>
                <div class="user-info" style="display: flex; flex-direction: column; text-align: left;">
                    <span class="user-name" id="header-user-name" style="font-size: 13px; font-weight: 600; color: var(--text-main); line-height: 1.2;">Khải Trần</span>
                    <span class="user-role" id="header-user-role" style="font-size: 11px; color: var(--text-muted);">Trưởng phòng</span>
                </div>
                <i class="fa-solid fa-chevron-down dropdown-icon" id="user-dropdown-arrow" style="font-size: 10px; color: var(--text-muted); transition: transform var(--transition-fast);"></i>
            </div>

            <!-- Dropdown Menu Box -->
            <div class="user-dropdown-menu" id="header-user-menu">
                <div class="user-dropdown-header">
                    <div class="user-dropdown-avatar" id="dropdown-user-avatar" style="background-color: var(--primary-color);">KT</div>
                    <div class="user-dropdown-info">
                        <span class="user-dropdown-name" id="dropdown-user-name">Khải Trần</span>
                        <span class="user-dropdown-email" id="dropdown-user-email">khai.tran@namviet.vn</span>
                        <span class="user-dropdown-badge" id="dropdown-user-badge">Trưởng phòng</span>
                    </div>
                </div>
                <ul class="user-dropdown-list">
                    <li>
                        <a href="/pages/profile/profile.html">
                            <i class="fa-solid fa-user-gear" style="color: var(--primary-color);"></i>
                            <span>Hồ sơ cá nhân</span>
                        </a>
                    </li>
                    <li>
                        <a href="/pages/profile/change-password.html">
                            <i class="fa-solid fa-key" style="color: #fa8c16;"></i>
                            <span>Đổi mật khẩu</span>
                        </a>
                    </li>
                    <div class="user-dropdown-divider"></div>
                    <li>
                        <a href="#" class="text-danger" id="header-logout-btn">
                            <i class="fa-solid fa-arrow-right-from-bracket" style="color: var(--danger-color);"></i>
                            <span style="color: var(--danger-color); font-weight: 600;">Đăng xuất</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
