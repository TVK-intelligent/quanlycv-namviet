<div id="global-modal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="modal-title">Tiêu đề Modal</div>
            <button class="modal-close" onclick="closeModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="modal-body" id="modal-body">
            <!-- Nội dung động của modal sẽ được chèn vào đây qua JS -->
            <p>Nội dung mô tả hoặc form nhập liệu...</p>
        </div>
        <div class="modal-footer" id="modal-footer">
            <button class="btn btn-secondary" id="modal-cancel-btn" onclick="closeModal()">Hủy</button>
            <button class="btn btn-primary" id="modal-confirm-btn">Xác nhận</button>
        </div>
    </div>
</div>

<script>
    // Các hàm helper dùng chung để mở/đóng Modal từ mọi nơi
    if (typeof window.openModal !== 'function') {
        window.openModal = function(title, contentHtml, onConfirmCallback, options = {}) {
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            if (titleEl) titleEl.innerHTML = title || 'Xác nhận';
            if (bodyEl && contentHtml) bodyEl.innerHTML = contentHtml;
            
            const showCancel = options && typeof options.showCancel === 'boolean' ? options.showCancel : !!onConfirmCallback;
            if (cancelBtn) {
                cancelBtn.style.display = showCancel ? '' : 'none';
                if (options && options.cancelText) cancelBtn.textContent = options.cancelText;
                else cancelBtn.textContent = 'Hủy';
            }

            if (confirmBtn) {
                const newConfirmBtn = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
                
                if (options && options.confirmText) newConfirmBtn.textContent = options.confirmText;
                else if (!onConfirmCallback) newConfirmBtn.textContent = 'Đóng';
                else newConfirmBtn.textContent = 'Xác nhận';

                if (typeof onConfirmCallback === 'function') {
                    newConfirmBtn.addEventListener('click', onConfirmCallback);
                } else {
                    newConfirmBtn.addEventListener('click', closeModal);
                }
            }

            document.getElementById('global-modal').classList.add('active');
        };
    }

    if (typeof window.closeModal !== 'function') {
        window.closeModal = function() {
            const m = document.getElementById('global-modal');
            if (m) m.classList.remove('active');
        };
    }
</script>
