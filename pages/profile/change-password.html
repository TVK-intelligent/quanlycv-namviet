<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - Work Management</title>
    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/profile.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Render Sidebar ở đây -->
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <!-- Render Header ở đây -->
            <div id="header-container"></div>

            <!-- Nội dung chính -->
            <main class="main-content" style="display: flex; flex-direction: column;">
                <!-- Breadcrumb -->
                <div class="breadcrumb" style="margin-bottom: 24px;">
                    <span class="breadcrumb-item"><a href="/index.html">🏠 Trang chủ</a></span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-item"><a href="/pages/profile/profile.html">👤 Hồ sơ cá nhân</a></span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-item active">🔑 Đổi mật khẩu</span>
                </div>

                <!-- Form container -->
                <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 0;">
                    <div class="profile-card" style="width: 440px; max-width: 100%;">
                        <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 8px; text-align: center; color: var(--text-main);">
                            <i class="fa-solid fa-key" style="color: var(--primary-color); margin-right: 8px;"></i>Đổi mật khẩu tài khoản
                        </h2>
                        <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px;">
                            Vui lòng nhập mật khẩu cũ và thiết lập mật khẩu mới có độ bảo mật cao.
                        </p>

                        <form id="change-password-form">
                            <div class="form-group">
                                <label class="form-label required" for="current-password">Mật khẩu hiện tại</label>
                                <div style="position: relative;">
                                    <input type="password" class="form-control" id="current-password" required placeholder="Nhập mật khẩu hiện tại" style="padding-right: 36px;">
                                    <button type="button" class="toggle-password-btn" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;">
                                        <i class="fa-regular fa-eye-slash"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-group" style="margin-top: 16px;">
                                <label class="form-label required" for="new-password">Mật khẩu mới</label>
                                <div style="position: relative;">
                                    <input type="password" class="form-control" id="new-password" required placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" style="padding-right: 36px;">
                                    <button type="button" class="toggle-password-btn" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;">
                                        <i class="fa-regular fa-eye-slash"></i>
                                    </button>
                                </div>
                                <div class="password-strength-meter" style="display: flex; gap: 4px; margin-top: 6px; height: 4px;">
                                    <div class="strength-bar" style="flex: 1; background: #e2e8f0; border-radius: 2px; transition: background 0.3s;"></div>
                                    <div class="strength-bar" style="flex: 1; background: #e2e8f0; border-radius: 2px; transition: background 0.3s;"></div>
                                    <div class="strength-bar" style="flex: 1; background: #e2e8f0; border-radius: 2px; transition: background 0.3s;"></div>
                                </div>
                                <span id="password-feedback" style="font-size: 11px; color: var(--text-muted); display: block; margin-top: 4px;">Nhập mật khẩu mới...</span>
                            </div>

                            <div class="form-group" style="margin-top: 16px; margin-bottom: 24px;">
                                <label class="form-label required" for="confirm-password">Xác nhận mật khẩu mới</label>
                                <div style="position: relative;">
                                    <input type="password" class="form-control" id="confirm-password" required placeholder="Nhập lại mật khẩu mới" style="padding-right: 36px;">
                                    <button type="button" class="toggle-password-btn" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;">
                                        <i class="fa-regular fa-eye-slash"></i>
                                    </button>
                                </div>
                            </div>

                            <div style="display: flex; gap: 12px; margin-top: 24px;">
                                <a href="/pages/profile/profile.html" class="btn btn-secondary" style="flex: 1; display: flex; align-items: center; justify-content: center;">Hủy bỏ</a>
                                <button type="submit" class="btn btn-primary" style="flex: 1;">Xác nhận đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>

            <!-- Render Footer ở đây -->
            <div id="footer-container"></div>
        </div>
    </div>

    <!-- Render Modal & Loading ở đây -->
    <div id="modal-container"></div>
    <div id="loading-container"></div>

    <!-- Base JS -->
    <script src="/js/auth.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
