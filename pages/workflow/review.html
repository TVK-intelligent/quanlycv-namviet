    <style>
      .bottom-sheet {
        transform: translateY(100%);
        animation: slideUp 0.3s ease-out forwards;
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      .custom-checkbox {
        appearance: none;
        width: 20px;
        height: 20px;
        border: 2px solid theme("colors.outline-variant");
        border-radius: 4px;
        outline: none;
        transition: all 0.2s ease;
        position: relative;
        cursor: pointer;
      }

      .custom-checkbox:checked {
        background-color: theme("colors.primary");
        border-color: theme("colors.primary");
      }

      .custom-checkbox:checked::after {
        content: "";
        position: absolute;
        left: 5px;
        top: 2px;
        width: 6px;
        height: 10px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }

      .custom-checkbox:focus-visible {
        box-shadow:
          0 0 0 2px theme("colors.surface"),
          0 0 0 4px theme("colors.primary");
      }
    </style>

    <!-- Backdrop -->

          Gửi thành công
        </h2>

          <span

            data-icon="close"
            >close</span

        </button>
      </div>
      <!-- Scrollable Content -->

        class="flex-1 overflow-y-auto px-margin-edge py-stack-md space-y-stack-md"

            Đã nộp bài thành công!
          </h3>

            class="font-body-md text-body-md text-on-surface-variant max-w-[280px]"
          >
            Yêu cầu của bạn đã được chuyển đến Reviewer. Bạn sẽ nhận được thông
            báo sau khi có kết quả phê duyệt.
          </p>

      <!-- Footer Actions -->

          class="w-full h-touch-target flex items-center justify-center bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:bg-primary-fixed-variant transition-colors active:scale-[0.98]"

          Đóng

    <script>
      // Simple script to handle checkbox counter logic for demonstration
      document.addEventListener("DOMContentLoaded", () => {
        const checkboxes = document.querySelectorAll(".custom-checkbox");
        const counterDisplay = document.querySelector(".bg-primary-fixed");
        const submitBtn = document.querySelector("button.bg-primary");
        const urlInput = document.getElementById("proof-url");

        function updateState() {
          const checkedCount = Array.from(checkboxes).filter(
            (cb) => cb.checked,
          ).length;
          const total = checkboxes.length;

          counterDisplay.textContent = `Yêu cầu (${checkedCount}/${total})`;

          if (checkedCount === total) {
            counterDisplay.classList.remove("bg-primary-fixed", "text-primary");
            counterDisplay.classList.add(
              "bg-secondary-container",
              "text-on-secondary-container",
            );
          } else {
            counterDisplay.classList.add("bg-primary-fixed", "text-primary");
            counterDisplay.classList.remove(
              "bg-secondary-container",
              "text-on-secondary-container",
            );
          }

          // Simulate validation state (DoD checked + URL entered)
          const isUrlValid = urlInput.value.trim().length > 0;
          if (checkedCount === total && isUrlValid) {
            submitBtn.removeAttribute("disabled");
          } else {
            submitBtn.setAttribute("disabled", "true");
          }
        }

        checkboxes.forEach((cb) => cb.addEventListener("change", updateState));
        urlInput.addEventListener("input", updateState);

        // Initial setup
        submitBtn.setAttribute("disabled", "true");
      });
    </script>
