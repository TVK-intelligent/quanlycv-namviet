<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checklist - Work Management</title>

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS dùng chung của project -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/layout.css" />

    <!-- CSS riêng cho Checklist và Task Định kỳ -->
    <link rel="stylesheet" href="/css/checklist.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body data-breadcrumb-parent="Quy trình" data-breadcrumb-current="Danh mục kiểm tra">
    <div class="app-container">
      <!-- Sidebar được common.js tự động tải -->
      <div id="sidebar-container"></div>

      <div class="main-wrapper">
        <!-- Header được common.js tự động tải -->
        <div id="header-container"></div>

        <!-- ================= NỘI DUNG CHÍNH ================= -->
        <main class="main-content">
          <div class="checklist-page">
            <!-- Breadcrumb -->
            <div class="breadcrumb" style="margin-bottom: 16px;">
              <span class="breadcrumb-item">Quy trình</span>
              <span class="breadcrumb-item">/</span>
              <span class="breadcrumb-item active">Danh mục kiểm tra</span>
            </div>

            <!-- ================================================= -->
            <!--              SECTION CHECKLIST                   -->
            <!-- ================================================= -->
            <div id="checklist-section">
              <!-- Tiêu đề -->
              <div class="checklist-header">
                <h1>Danh mục tiêu chuẩn kiểm tra</h1>

                <button class="btn-create-checklist" id="create-checklist-btn">
                  <i class="fa-solid fa-plus"></i>
                  Tạo Danh mục Kiểm tra
                </button>
              </div>

              <!-- Bộ lọc -->
              <div class="checklist-card checklist-toolbar">
                <!-- Loại -->
                <div class="filter-group">
                  <label for="checklist-type">Loại</label>

                  <select id="checklist-type" class="checklist-select">
                    <option value="all">Tất cả</option>
                    <option value="DoR">DoR (Điều kiện bắt đầu)</option>
                    <option value="DoD">DoD (Điều kiện hoàn thành)</option>
                  </select>
                </div>

                <!-- Phòng ban -->
                <div class="filter-group">
                  <label for="department">Phòng ban áp dụng</label>

                  <select id="department" class="checklist-select">
                    <option value="all">Tất cả phòng ban</option>
                    <option value="dev">Phát triển Phần mềm</option>
                    <option value="qa">Kiểm thử (QA/QC)</option>
                    <option value="design">Thiết kế (UI/UX)</option>
                  </select>
                </div>

                <!-- Tìm kiếm -->
                <div class="filter-group search-group">
                  <label for="checklist-search">Tìm kiếm</label>

                  <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                      type="text"
                      id="checklist-search"
                      class="checklist-input"
                      placeholder="Tìm kiếm danh mục kiểm tra..."
                    />
                  </div>
                </div>
              </div>

              <!-- Bảng Checklist -->
              <div class="checklist-card checklist-table-card">
                <div class="table-responsive">
                  <table class="checklist-table">
                    <thead>
                      <tr>
                        <th>Tên danh mục kiểm tra</th>
                        <th>Loại</th>
                        <th>Phòng ban áp dụng</th>
                        <th>Số lượng mục</th>
                        <th>Ngày tạo</th>
                        <th>Trạng thái</th>
                        <th class="action-column">Thao tác</th>
                      </tr>
                    </thead>

                    <tbody id="checklist-body">
                      <!-- Sẽ được render tự động qua js/checklist.js -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            <!-- KẾT THÚC SECTION CHECKLIST -->
          </div>
        </main>

        <!-- Footer -->
        <div id="footer-container"></div>
      </div>
    </div>

    <!-- Modal -->
    <div id="modal-container"></div>

    <!-- Loading -->
    <div id="loading-container"></div>

    <!-- JS chung -->
    <script src="/js/common.js"></script>

    <!-- JS riêng -->
    <script src="/js/checklist.js"></script>
  </body>
</html>
