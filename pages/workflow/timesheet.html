<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Timesheet - Work Management</title>

    <!-- CSS dùng chung -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/layout.css" />

    <!-- CSS riêng Timesheet -->
    <link rel="stylesheet" href="/css/timesheet.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div class="app-container">
      <div id="sidebar-container"></div>

      <div class="main-wrapper">
        <div id="header-container"></div>

        <main class="main-content">
          <div class="timesheet-page">
            <!-- Breadcrumb -->
            <div class="breadcrumb">
              <span>Quy trình</span>
              <span>/</span>
              <span class="current">Bảng chấm công</span>
            </div>

            <!-- Header -->
            <div class="timesheet-header">
              <div>
                <h1>Bảng chấm công</h1>
                <p>Theo dõi và quản lý thời gian làm việc</p>
              </div>

              <button
                type="button"
                class="btn-create-timesheet"
                id="btn-open-modal"
              >
                <i class="fa-solid fa-plus"></i>
                Thêm thời gian
              </button>
            </div>

            <!-- Chọn tuần -->
            <div class="timesheet-card week-toolbar">
              <button type="button" class="week-nav-btn" id="prev-week">
                <i class="fa-solid fa-chevron-left"></i>
              </button>

              <div class="week-info">
                <div class="week-label" id="week-range"></div>
                <div class="week-number" id="week-number"></div>
              </div>

              <button type="button" class="week-nav-btn" id="next-week">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            </div>

            <!-- Thống kê -->
            <div class="timesheet-stats">
              <div class="stat-card">
                <div class="stat-label">Tổng thời gian</div>

                <div class="stat-value" id="total-hours">0h</div>
              </div>

              <div class="stat-card">
                <div class="stat-label">Mục tiêu</div>

                <div class="stat-value">40h</div>
              </div>

              <div class="stat-card missing-card">
                <div class="stat-label">Còn thiếu</div>

                <div class="stat-value" id="missing-hours">40h</div>
              </div>
            </div>

            <!-- Bộ lọc -->
            <div class="timesheet-card timesheet-toolbar">
              <div class="filter-group">
                <label for="timesheet-search"> Tìm kiếm </label>

                <div class="search-wrapper">
                  <i class="fa-solid fa-magnifying-glass"></i>

                  <input
                    type="text"
                    id="timesheet-search"
                    class="timesheet-input"
                    placeholder="Tìm kiếm công việc..."
                  />
                </div>
              </div>

              <div class="filter-group">
                <label for="timesheet-date-filter"> Ngày làm việc </label>

                <select id="timesheet-date-filter" class="timesheet-select">
                  <option value="all">Tất cả ngày</option>
                </select>
              </div>
            </div>

            <!-- Bảng Timesheet -->
            <div class="timesheet-card timesheet-table-card">
              <div class="table-responsive">
                <table class="timesheet-table">
                  <thead>
                    <tr>
                      <th>Ngày</th>
                      <th>Công việc</th>
                      <th>Mô tả</th>
                      <th>Số giờ</th>
                      <th class="action-column">Thao tác</th>
                    </tr>
                  </thead>

                  <tbody id="timesheet-body">
                    <!-- JavaScript render -->
                  </tbody>
                </table>
              </div>

              <div class="empty-timesheet" id="empty-timesheet">
                <i class="fa-regular fa-clock"></i>

                <p>Chưa có dữ liệu chấm công</p>
              </div>
            </div>

            <!-- Nút gửi -->
            <div class="timesheet-footer-action">
              <button
                type="button"
                class="btn-submit-timesheet"
                id="submit-timesheet"
              >
                <i class="fa-solid fa-paper-plane"></i>
                Gửi bảng chấm công
              </button>
            </div>
          </div>
        </main>

        <div id="footer-container"></div>
      </div>
    </div>

    <!-- Modal -->
    <div class="timesheet-modal" id="timesheet-modal">
      <div class="modal-overlay"></div>

      <div class="timesheet-modal-content">
        <div class="modal-header">
          <div>
            <h2 id="modal-title">Thêm thời gian làm việc</h2>

            <p>Nhập thông tin thời gian làm việc của bạn</p>
          </div>

          <button type="button" class="modal-close" id="close-modal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <form id="timesheet-form">
          <input type="hidden" id="edit-id" />

          <div class="form-group">
            <label for="task-name"> Công việc </label>

            <select id="task-name" required>
              <option value="">-- Chọn công việc --</option>

              <option value="PRJ-042: Chuyển đổi cơ sở dữ liệu">
                PRJ-042: Chuyển đổi cơ sở dữ liệu
              </option>

              <option value="PRJ-045: Thiết kế lại giao diện">
                PRJ-045: Thiết kế lại giao diện
              </option>

              <option value="INT-001: Họp nội bộ">INT-001: Họp nội bộ</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="work-date"> Ngày làm việc </label>

              <input type="date" id="work-date" required />
            </div>

            <div class="form-group">
              <label for="work-hours"> Số giờ </label>

              <input
                type="number"
                id="work-hours"
                min="0.5"
                max="16"
                step="0.5"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="work-description"> Mô tả công việc </label>

            <textarea
              id="work-description"
              rows="4"
              placeholder="Nhập nội dung công việc đã thực hiện..."
            ></textarea>
          </div>

          <p class="form-error" id="form-error"></p>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancel-modal">
              Hủy
            </button>

            <button type="submit" class="btn-save">
              <i class="fa-solid fa-floppy-disk"></i>
              Lưu thời gian
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Thông báo -->
    <div class="toast" id="toast"></div>

    <!-- JS dùng chung -->
    <script src="/js/common.js"></script>

    <!-- JS riêng Timesheet -->
    <script src="/js/timesheet.js"></script>
  </body>
</html>
