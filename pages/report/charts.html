<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETRMS - Thống kê tổng quan</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/report.css">
</head>
<body
    data-breadcrumb-parent="Báo cáo & Thống kê"
    data-breadcrumb-current="Thống kê tổng quan"
>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <div id="header-container"></div>

            <main class="main-content">
                <h1 class="page-title">Thống kê tổng quan</h1>

                <section class="table-card">
                    <div class="table-toolbar">
                        <h2>Bộ lọc báo cáo</h2>
                        <div class="report-toolbar-actions">
                            <button id="reset-report-filters" class="btn btn-outline" type="button">
                                Đặt lại bộ lọc
                            </button>

                            <button
                                class="btn btn-outline"
                                type="button"
                                disabled
                                title="Sẽ thực hiện ở Phase 5"
                            >
                                Xuất báo cáo
                            </button>
                        </div>
                    </div>

                    <div class="report-filter-content">
                        <div class="report-filter-grid">
                            <div class="form-group">
                                <label class="form-label" for="report-date-from">
                                    Từ ngày
                                </label>
                                <input
                                    id="report-date-from"
                                    class="form-control"
                                    type="date"
                                >
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="report-date-to">
                                    Đến ngày
                                </label>
                                <input
                                    id="report-date-to"
                                    class="form-control"
                                    type="date"
                                >
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="report-project-filter">
                                    Dự án
                                </label>
                                <select id="report-project-filter" class="form-control">
                                    <option value="">Tất cả dự án</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="report-department-filter">
                                    Phòng ban
                                </label>
                                <select id="report-department-filter" class="form-control">
                                    <option value="">Tất cả phòng ban</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="report-charts-grid">
                    <div class="table-card">
                        <div class="table-toolbar">
                            <h2>Phân bố trạng thái công việc</h2>
                        </div>
                        <div id="task-status-chart" class="report-chart-body">
                            <p>Đang tải dữ liệu trạng thái task...</p>
                        </div>
                    </div>

                    <div class="table-card">
                        <div class="table-toolbar">
                            <h2>Sức tải trung bình theo phòng ban</h2>
                        </div>
                        <div id="department-wsi-chart" class="report-chart-body">
                            <p>Đang tải dữ liệu sức tải...</p>
                        </div>
                    </div>

                    <div class="table-card report-chart-card--wide">
                        <div class="table-toolbar">
                            <h2>Tốc độ hoàn thành milestone</h2>
                        </div>
                        <div id="milestone-chart" class="report-chart-body">
                            <p>Đang tải dữ liệu milestone...</p>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/report.js"></script>
</body>
</html>
