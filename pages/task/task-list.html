<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Management - Danh sách Công việc</title>
    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: #1F2937;
            margin: 0 0 2px 0;
        }
        .page-subtitle {
            font-size: 12px;
            color: #6B7280;
            margin: 0;
        }

        .task-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            width: 100%;
            overflow: hidden;
        }

        /* Bộ lọc */
        .filter-toolbar {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid #E5E7EB;
            background: #FAFAFA;
            flex-wrap: nowrap;
        }
        .filter-toolbar .form-control {
            height: 30px;
            font-size: 12px;
            border: 1px solid #D1D5DB;
            border-radius: 4px;
            padding: 0 6px;
            background-color: #FFFFFF;
            color: #374151;
        }

        .table-responsive {
            width: 100%;
            overflow: hidden;
        }
        .clean-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            table-layout: fixed;
        }
        .clean-table thead th {
            background: #F9FAFB;
            color: #4B5563;
            font-weight: 600;
            padding: 8px 6px;
            border-bottom: 1px solid #E5E7EB;
            white-space: nowrap;
            vertical-align: middle;
            text-align: left;
        }
        .clean-table tbody td {
            padding: 8px 6px;
            border-bottom: 1px solid #F3F4F6;
            vertical-align: middle;
            color: #1F2937;
            white-space: nowrap;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .clean-table tbody tr:hover {
            background-color: #F9FAFB;
        }

        .badge-code {
            font-weight: 700;
            color: #0958D9;
            background: #E6F4FF;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 11px;
            display: inline-block;
        }
        .user-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            max-width: 100%;
            overflow: hidden;
        }
        .user-avatar {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1890FF;
            color: #FFFFFF;
            font-size: 8.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .badge-status {
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 10.5px;
            font-weight: 600;
            display: inline-block;
        }
        .status-todo { background: #F3F4F6; color: #4B5563; }
        .status-inprogress { background: #E6F4FF; color: #0958D9; }
        .status-blocked { background: #FFF1F0; color: #CF1322; }
        .status-review { background: #FFFBE6; color: #D48806; }
        .status-done { background: #F6FFED; color: #389E0D; }

        .badge-p1 { background: #FFF1F0; color: #CF1322; font-weight: 700; padding: 1px 4px; border-radius: 3px; }
        .badge-p2 { background: #FFF7E6; color: #D46B08; font-weight: 700; padding: 1px 4px; border-radius: 3px; }
        .badge-p3 { background: #E6F4FF; color: #0958D9; font-weight: 700; padding: 1px 4px; border-radius: 3px; }
        .badge-p4 { background: #F3F4F6; color: #4B5563; font-weight: 700; padding: 1px 4px; border-radius: 3px; }

        .action-btns {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }
        .action-btns button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar nạp qua common.js -->
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <!-- Header nạp qua common.js -->
            <div id="header-container"></div>

            <main class="main-content" style="padding: 14px 16px;">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Danh sách công việc</h1>
                        <p class="page-subtitle">Quản lý công việc của dự án</p>
                    </div>
                    <button class="btn btn-primary" id="btn-create-task" style="height: 32px; padding: 0 10px; font-size: 12px;">
                        <i class="fa-solid fa-plus" style="margin-right: 4px;"></i> Tạo công việc mới
                    </button>
                </div>

                <div class="task-card">
                    <div class="filter-toolbar">
                        <input type="text" id="filter-search" class="form-control" style="flex: 1.2; min-width: 130px;" placeholder="🔍 Tìm tên hoặc mã...">
                        
                        <select id="filter-project" class="form-control" style="flex: 1; max-width: 140px;">
                            <option value="">Tất cả Dự án</option>
                            <option value="Thiết kế hệ thống EDR">Thiết kế hệ thống EDR</option>
                            <option value="Triển khai CRM">Triển khai CRM</option>
                            <option value="Hệ thống nội bộ">Hệ thống nội bộ</option>
                        </select>

                        <select id="filter-dept" class="form-control" style="flex: 1; max-width: 120px;">
                            <option value="">Tất cả Phòng ban</option>
                            <option value="Phòng CNTT">Phòng CNTT</option>
                            <option value="Phòng Kế toán">Phòng Kế toán</option>
                            <option value="Phòng Marketing">Phòng Marketing</option>
                            <option value="Phòng Kinh doanh">Phòng Kinh doanh</option>
                        </select>

                        <select id="filter-assignee" class="form-control" style="flex: 1; max-width: 120px;">
                            <option value="">Tất cả Người làm</option>
                            <option value="Hải Nam">Hải Nam</option>
                            <option value="Khải Trần">Khải Trần</option>
                            <option value="Lê Bách">Lê Bách</option>
                        </select>

                        <select id="filter-priority" class="form-control" style="width: 95px;">
                            <option value="">Độ ưu tiên</option>
                            <option value="P1">P1 - Khẩn cấp</option>
                            <option value="P2">P2 - Cao</option>
                            <option value="P3">P3 - Trung bình</option>
                            <option value="P4">P4 - Thấp</option>
                        </select>

                        <select id="filter-status" class="form-control" style="width: 105px;">
                            <option value="">Trạng thái</option>
                            <option value="TO_DO">TO_DO</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="BLOCKED">BLOCKED</option>
                            <option value="IN_REVIEW">IN_REVIEW</option>
                            <option value="DONE">DONE</option>
                        </select>

                        <button id="btn-reset-filters" class="btn btn-secondary" title="Đặt lại bộ lọc" style="height: 30px; width: 30px; padding: 0; display: flex; align-items: center; justify-content: center;">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="clean-table">
                            <thead>
                                <tr>
                                    <th style="width: 25px; text-align: center;"><input type="checkbox" id="check-all"></th>
                                    <th style="width: 75px;">Mã công việc</th>
                                    <th style="width: 18%;">  Tên công việc</th>
                                    <th style="width: 14%;">Dự án</th>
                                    <th style="width: 11%;">Phòng ban</th>
                                    <th style="width: 12%;">Người làm</th>
                                    <th style="width: 55px; text-align: center;">Ưu tiên</th>
                                    <th style="width: 45px; text-align: center;">Thời gian</th>
                                    <th style="width: 90px; text-align: center;">Trạng thái</th>
                                    <th style="width: 80px; text-align: center;">Thời hạn</th>
                                    <th style="width: 50px; text-align: right;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="task-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>

            <div id="footer-container"></div>
        </div>
    </div>

    <!-- Modal Root Container -->
    <div id="modal-container"></div>
    <div id="loading-container"></div>

    <script src="/js/common.js"></script>
    <script src="/js/task-list.js"></script>
</body>
</html>
